<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Smooth iOS Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- Dark Premium Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Effect for Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Dark Background -->
    <rect width="512" height="512" fill="url(#bgGradient)" />

    <!-- Subtle Background Grid Pattern -->
    <g opacity="0.05" stroke="#ffffff" stroke-width="1">
      <line x1="64" y1="0" x2="64" y2="512" />
      <line x1="128" y1="0" x2="128" y2="512" />
      <line x1="192" y1="0" x2="192" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="320" y1="0" x2="320" y2="512" />
      <line x1="384" y1="0" x2="384" y2="512" />
      <line x1="448" y1="0" x2="448" y2="512" />
      
      <line x1="0" y1="64" x2="512" y2="64" />
      <line x1="0" y1="128" x2="512" y2="128" />
      <line x1="0" y1="192" x2="512" y2="192" />
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="0" y1="320" x2="512" y2="320" />
      <line x1="0" y1="384" x2="512" y2="384" />
      <line x1="0" y1="448" x2="512" y2="448" />
    </g>

    <!-- Geometric Connecting Vector Lines (Garage Roof Structure) -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glow)">
      <!-- Main Outer Roof Triangle & Pillars -->
      <line x1="150" y1="250" x2="256" y2="160" />
      <line x1="256" y1="160" x2="362" y2="250" />
      <line x1="150" y1="250" x2="150" y2="350" />
      <line x1="362" y1="250" x2="362" y2="350" />

      <!-- Inner Support Structure Lines -->
      <line x1="150" y1="250" x2="362" y2="250" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="256" y1="160" x2="256" y2="310" />
      <line x1="150" y1="250" x2="256" y2="310" />
      <line x1="362" y1="250" x2="256" y2="310" />
    </g>

    <!-- Vector Dots (6 Key Geometric Nodes) -->
    <!-- Top Roof Apex Dot -->
    <circle cx="256" cy="160" r="10" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="160" r="4" fill="#0f172a" />

    <!-- Left Roof Eave Dot -->
    <circle cx="150" cy="250" r="10" fill="#ffffff" filter="url(#glow)" />
    <circle cx="150" cy="250" r="4" fill="#0f172a" />

    <!-- Right Roof Eave Dot -->
    <circle cx="362" cy="250" r="10" fill="#ffffff" filter="url(#glow)" />
    <circle cx="362" cy="250" r="4" fill="#0f172a" />

    <!-- Bottom Left Pillar Base Dot -->
    <circle cx="150" cy="350" r="9" fill="#ffffff" filter="url(#glow)" />

    <!-- Bottom Right Pillar Base Dot -->
    <circle cx="362" cy="350" r="9" fill="#ffffff" filter="url(#glow)" />

    <!-- Center Geometric Core Node Dot -->
    <circle cx="256" cy="310" r="12" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="310" r="5" fill="#38bdf8" />
  </g>

  <!-- Border Frame -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.12" />
</svg>
