<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Smooth iOS Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Crisp White Background with rounded corners -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="#ffffff" />

    <!-- App Window Frame (Blue outline with rounded corners and 3 window dots) -->
    <rect x="136" y="156" width="240" height="200" rx="32" ry="32" fill="none" stroke="#2563eb" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Window Control Dots (3 small dots on top left of window) -->
    <circle cx="178" cy="192" r="7" fill="#2563eb" />
    <circle cx="198" cy="192" r="7" fill="#2563eb" />
    <circle cx="218" cy="192" r="7" fill="#2563eb" />

    <!-- Bold Electric Lightning Bolt Overlay (Blue) -->
    <!-- Positioned overlapping the window frame exactly as shown in reference logo -->
    <path d="M 284 100 L 194 280 L 260 280 L 228 412 L 324 228 L 258 228 Z" fill="#2563eb" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Soft Outer Subtle Border for clean App Icon rendering -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#e2e8f0" stroke-width="4" />
</svg>
