name = "rq-hono-preview"
main = "dist/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat", "allow_eval_during_startup"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://migration-unified-hono.rq-acg.pages.dev"
ENVIRONMENT = "preproduction"
WORKER_VERSION = "1.0.0-h5-preview"
FIREBASE_PROJECT_ID = "rq-hono-preview-isolated"
FIREBASE_DATABASE_ID = "(default)"

[[durable_objects.bindings]]
name = "PIN_RATE_LIMITER"
class_name = "PinRateLimiterDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PinRateLimiterDurableObject"]

# Secrets are intentionally not committed or copied from production.
# Configure isolated preproduction values only:
# - FIREBASE_SERVICE_ACCOUNT_JSON
# - BACKEND_OPERATOR_TOKEN
