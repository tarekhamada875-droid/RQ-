name: Phase 0 Baseline Verification

on:
  push:
    branches:
      - fix/phase-0-baseline-verification
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase-0-baseline-verification.yml
      - src/**
      - server/**
      - tools/**
      - package.json
      - package-lock.json
      - firestore.rules
      - firebase.json

permissions:
  contents: read

concurrency:
  group: phase-0-baseline-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the exact Phase 0 command
        run: npm run ci:check

      - name: Record exact Phase 0 repository counts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Non-test TypeScript lines in src/server ==="
          find src server -name '*.ts' -o -name '*.tsx' | grep -v -E '\\.test\\.|__tests__' | xargs wc -l | tail -1
          echo "=== Test lines in src/server/tools ==="
          find src server tools -name '*.test.*' | xargs wc -l | tail -1
          echo "=== Tracked checkout file count (excluding node_modules) ==="
          find . -path ./node_modules -prune -o -type f -print | wc -l
