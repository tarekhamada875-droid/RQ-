name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Server v2 foundation gate
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project rq-v2-emulator "npm run check:v2"

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f dist/cloud-run.cjs

      - name: Maintainability checks
        run: npm run maintainability:check

      - name: Live release smoke check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://rq-production-af02.up.railway.app
          SMOKE_FRONTEND_URL: https://rq-acg.pages.dev
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
        run: npm run release:smoke
