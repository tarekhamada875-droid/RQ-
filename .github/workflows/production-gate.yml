name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f api/index.js

      - name: Maintainability checks
        run: npm run maintainability:check

      - name: Live release smoke check
        env:
          SMOKE_BASE_URL: https://parqv2.vercel.app
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
        run: npm run release:smoke
