name: Production Gate

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: V3 legacy backend foundation gate
        run: npm test -- --run server/subscriberLifecycle.test.ts

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f dist/cloud-run.cjs

      - name: Maintainability checks
        run: npm run maintainability:check

      - name: Wait for Railway deployment and run live smoke check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://rq-production-af02.up.railway.app
          SMOKE_FRONTEND_URL: https://rq-acg.pages.dev
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
          SMOKE_MAX_ATTEMPTS: 60
          SMOKE_RETRY_DELAY_MS: 10000
        run: npm run release:smoke
