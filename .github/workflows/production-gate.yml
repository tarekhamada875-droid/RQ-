name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full commit SHA on main to verify and deploy
        required: true
        type: string
      source_run_id:
        description: Successful PR Production Gate run whose artifact should be reused
        required: false
        type: string
      source_sha:
        description: PR head SHA that produced the reusable verified artifact
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha || github.sha }}
          fetch-depth: 0

      - name: Confirm event commit
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Confirm manual target is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Detect Markdown-only change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          docs_only=true
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            docs_only=false
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --name-only -z "$BASE_SHA...$GITHUB_SHA" > "$changed_paths"; then
              docs_only=false
            fi
          else
            if ! git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$changed_paths"; then
              docs_only=false
            fi
          fi

          if [[ "$docs_only" == "true" ]]; then
            if [[ ! -s "$changed_paths" ]]; then
              docs_only=false
            else
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md) ;;
                  *) docs_only=false ;;
                esac
              done < "$changed_paths"
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Markdown-only change: $docs_only"

      - name: Validate Markdown-only change
        if: steps.scope.outputs.docs_only == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          else
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          fi
          echo "Markdown-only validation passed; application checks and build are skipped."

      - name: Setup Node
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Full test suite
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test

      - name: Firestore security rules emulator tests
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:rules

      - name: Production build
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build

      - name: Smoke built Worker artifact
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run smoke:worker-artifact

      - name: Maintainability checks
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run maintainability:check

      - name: Verify production artifacts
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          test -f dist/index.html
          test -s dist/worker.js

      - name: Upload verified production artifact
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rq-production-${{ github.event.pull_request.head.sha || inputs.deploy_sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy verified Worker and smoke test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.source_run_id == '' && github.ref == 'refs/heads/main' && needs.verify.outputs.docs_only != 'true'
    needs: verify
    concurrency:
      group: rq-cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cloudflare-production
      url: https://rq.tarekhamada875.workers.dev

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha || github.sha }}

      - name: Confirm event commit
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download artifact built by verification
        uses: actions/download-artifact@v4
        with:
          name: rq-production-${{ inputs.deploy_sha || github.sha }}
          path: dist/

      - name: Confirm downloaded production artifact
        run: |
          test -f dist/index.html
          test -s dist/worker.js

      - name: Smoke downloaded Worker artifact
        run: npm run smoke:worker-artifact

      - name: Deploy and smoke-test verified Worker artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_BASE_URL: https://rq.tarekhamada875.workers.dev
          SMOKE_FRONTEND_URL: https://rq-acg.pages.dev
          SMOKE_EXPECTED_VERSION: 1.0.0-production
          SMOKE_EXPECTED_COMMIT_SHA: ${{ inputs.deploy_sha || github.sha }}
          SMOKE_MAX_ATTEMPTS: 60
          SMOKE_RETRY_DELAY_MS: 10000
        run: >-
          npx --yes
          --package=wrangler@4.147.0
          --package=tsx@4.23.13
          --call 'wrangler deploy --config wrangler.deploy.toml --env="" --no-bundle --var WORKER_COMMIT_SHA:$SMOKE_EXPECTED_COMMIT_SHA && env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID tsx tools/release-smoke.ts'

  deploy-reused-artifact:
    name: Deploy reused PR artifact and smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.source_sha != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cloudflare-production
      url: https://rq.tarekhamada875.workers.dev

    steps:
      - name: Validate source gate and identical merged tree
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(sourceRunId) || sourceRunId <= 0) {
              throw new Error('source_run_id must be a positive workflow run ID.');
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.DEPLOY_SHA) || !/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA)) {
              throw new Error('deploy_sha and source_sha must be full lowercase commit SHAs.');
            }

            // GitHub's API can occasionally return a truncated response body. Retry only
            // transient transport/server errors; validation failures must still fail closed.
            const requestWithRetry = async (label, request, attempts = 4) => {
              for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                  return await request();
                } catch (error) {
                  const message = error?.message || String(error);
                  const status = error?.status || error?.response?.status;
                  const transient = status === 408 || status === 429 || status >= 500 ||
                    message.includes('Unexpected end of JSON input') ||
                    message.includes('ECONNRESET') || message.includes('ETIMEDOUT');
                  if (!transient || attempt === attempts) throw error;
                  core.warning(`${label} failed on attempt ${attempt}/${attempts}; retrying a transient GitHub API error.`);
                  await new Promise(resolve => setTimeout(resolve, attempt * 1500));
                }
              }
              throw new Error(`${label} failed after retries.`);
            };

            const { data: run } = await requestWithRetry('Source workflow run lookup', () =>
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceRunId })
            );
            if (run.name !== 'Production Gate' || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== process.env.SOURCE_SHA) {
              throw new Error('The source run is not the successful PR Production Gate for source_sha.');
            }
            const { data: associated } = await requestWithRetry('Associated pull request lookup', () =>
              github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: process.env.SOURCE_SHA,
                per_page: 100,
              })
            );
            const matches = associated.filter(pr => pr.base.ref === 'main' && pr.head.sha === process.env.SOURCE_SHA && pr.merged_at && pr.merge_commit_sha === process.env.DEPLOY_SHA);
            if (matches.length !== 1) {
              throw new Error('The source PR does not uniquely identify the requested merged commit.');
            }
            const [{ data: sourceCommit }, { data: mergedCommit }] = await Promise.all([
              requestWithRetry('Source commit lookup', () => github.rest.repos.getCommit({ owner, repo, ref: process.env.SOURCE_SHA })),
              requestWithRetry('Merged commit lookup', () => github.rest.repos.getCommit({ owner, repo, ref: process.env.DEPLOY_SHA })),
            ]);
            if (sourceCommit.commit.tree.sha !== mergedCommit.commit.tree.sha) {
              throw new Error('The merged commit tree differs from the source commit tested by the PR gate.');
            }
            core.info(`Reusing verified PR artifact from run ${sourceRunId}; source and merged trees are identical.`);

      - name: Checkout merged commit configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download artifact from successful PR gate
        uses: actions/download-artifact@v4
        with:
          name: rq-production-${{ inputs.source_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Confirm reused production artifact
        run: |
          test -f dist/index.html
          test -s dist/worker.js

      - name: Smoke reused Worker artifact
        run: npm run smoke:worker-artifact

      - name: Deploy and live-smoke reused Worker artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_BASE_URL: https://rq.tarekhamada875.workers.dev
          SMOKE_FRONTEND_URL: https://rq-acg.pages.dev
          SMOKE_EXPECTED_VERSION: 1.0.0-production
          SMOKE_EXPECTED_COMMIT_SHA: ${{ inputs.deploy_sha }}
          SMOKE_MAX_ATTEMPTS: 60
          SMOKE_RETRY_DELAY_MS: 10000
        run: >-
          npx --yes
          --package=wrangler@4.147.0
          --package=tsx@4.23.13
          --call 'wrangler deploy --config wrangler.deploy.toml --env="" --no-bundle --var WORKER_COMMIT_SHA:$SMOKE_EXPECTED_COMMIT_SHA && env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID tsx tools/release-smoke.ts'
