name: H5 Preview Worker

on:
  push:
    branches: [migration/unified-hono]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-h5-preview
  cancel-in-progress: true

jobs:
  verify:
    name: Verify preview bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce owner UI/UX freeze
        run: |
          git fetch origin main --no-tags
          main_ref=FETCH_HEAD
          merge_base=$(git merge-base "$main_ref" HEAD) || {
            echo "Unable to enforce owner UI/UX freeze: no merge base between fetched main and HEAD."
            exit 1
          }
          echo "UI freeze fetched-main commit: $(git rev-parse "$main_ref")"
          echo "UI freeze merge base: $merge_base"
          forbidden=$(git diff --name-only "$merge_base" HEAD | grep -E '^(src/components/|src/hooks/|src/index\.css$|public/|index\.html$)' | grep -vE '^src/components/auth/(AdminLoginView|DelegateLoginView)\.tsx$' || true)
          if [ -n "$forbidden" ]; then
            echo "UI/UX freeze violation: these paths must not change without explicit owner approval:"
            echo "$forbidden"
            exit 1
          fi
          app_diff_hash=$(git diff "$merge_base" HEAD -- src/App.tsx | sha256sum | cut -d' ' -f1)
          echo "UI freeze src/App.tsx diff hash: $app_diff_hash"
          if [ "$app_diff_hash" != "f2bd1a90431e34564ad344a26911d1ef3dbde6a2aa34946c5c06d539ec0fff9e" ]; then
            echo "UI/UX freeze violation: src/App.tsx contains an unapproved change."
            exit 1
          fi

      - name: Typecheck
        run: npm run lint

      - name: Focused H5 contract tests
        run: npm test -- --run server/h5DualRuntime.contract.test.ts server/api.test.ts

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Verify Worker artifact
        run: test -s dist/worker.js

  deploy:
    name: Deploy rq-hono-preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-h5-preview
      url: https://rq-hono-preview.tarekhamada875.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build preview Worker bundle
        run: npm run build:cloudflare

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.147.0 deploy --config wrangler.preview.toml --minify

      - name: Smoke test public health and version
        env:
          PREVIEW_URL: https://rq-hono-preview.tarekhamada875.workers.dev
        run: |
          for attempt in 1 2 3 4 5; do
            health=$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL/api/health" || true)
            version=$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL/api/version" || true)
            echo "$health"
            echo "$version"
            if echo "$health" | grep -Eiq 'ok|healthy|status' && echo "$version" | grep -Eiq 'version|h5-preview'; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview Worker health/version smoke test failed"
          exit 1

      - name: Smoke test unauthenticated protection
        env:
          PREVIEW_URL: https://rq-hono-preview.tarekhamada875.workers.dev
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$PREVIEW_URL/api/garages/garage-a")
          test "$status" = "401" || test "$status" = "403" || test "$status" = "503"
