name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Verify Worker artifact
        run: test -s dist/worker.js

      - name: Maintainability checks
        run: npm run maintainability:check

  deploy:
    name: Deploy rq Worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-production
      url: https://rq.tarekhamada875.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Cloudflare Worker bundle
        run: npm run build:cloudflare

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.147.0 deploy --config wrangler.deploy.toml --env="" --minify

      - name: Smoke test Worker health
        env:
          HEALTH_URL: https://rq.tarekhamada875.workers.dev/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            response=$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" || true)
            echo "$response"
            if echo "$response" | grep -Eiq 'ok|healthy|status'; then
              exit 0
            fi
            sleep 10
          done
          echo "Worker health endpoint did not return a recognized healthy response"
          exit 1
